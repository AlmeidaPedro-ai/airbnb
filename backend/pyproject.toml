[project]
name = "airbnb-gestao"
version = "0.1.0"
description = "Gestão de locação de temporada (métricas, finanças e IR)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "api: testes de integração que exigem banco (DATABASE_URL).",
]

[tool.ruff]
line-length = 100
target-version = "py311"
