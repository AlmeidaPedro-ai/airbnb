# Postgres local para desenvolvimento. O backend roda fora do compose nesta
# fase (uvicorn local); nas próximas fases adicionamos o serviço da API.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airbnb
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airbnb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
